[project]
name = "netsage-backend"
version = "0.1.0"
description = "Backend for NetSage AI"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "sqlalchemy",
    "pydantic",
    "pydantic-settings",
    "google-genai",
    "requests",
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "bcrypt",
    "PyJWT",
    "python-multipart",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
